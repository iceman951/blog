<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 526" width="720" height="526" role="img" aria-label="Energy per request by Bun HTTP framework on MacBook Air M5">
	<style>
		text { font-family: Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, 'Noto Sans Thai', 'Leelawadee UI', Thonburi, sans-serif; fill: #0f172a; }
		.title { font-size: 32px; font-weight: 600; letter-spacing: -0.01em; }
		.subtitle { font-size: 20px; fill: #475569; }
		.label { font-size: 22px; }
		.value { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
		.tick { font-size: 18px; fill: #64748b; font-variant-numeric: tabular-nums; }
		.note { font-size: 19px; fill: #475569; }
		.grid { stroke: #e2e8f0; stroke-width: 1; }
		.axis { stroke: #cbd5e1; stroke-width: 1.5; }
	</style>

	<text x="24" y="46" class="title">Energy per request on an M5 Air</text>
	<text x="24" y="80" class="subtitle">Millijoules of SoC energy per request</text>
	<line x1="200" y1="116" x2="200" y2="404" class="grid"/>
	<text x="200" y="432" class="tick" text-anchor="middle">0.00</text>
	<line x1="294" y1="116" x2="294" y2="404" class="grid"/>
	<text x="294" y="432" class="tick" text-anchor="middle">0.05</text>
	<line x1="388" y1="116" x2="388" y2="404" class="grid"/>
	<text x="388" y="432" class="tick" text-anchor="middle">0.10</text>
	<line x1="481.99999999999994" y1="116" x2="481.99999999999994" y2="404" class="grid"/>
	<text x="481.99999999999994" y="432" class="tick" text-anchor="middle">0.15</text>
	<line x1="576" y1="116" x2="576" y2="404" class="grid"/>
	<text x="576" y="432" class="tick" text-anchor="middle">0.20</text>
	<line x1="200" y1="116" x2="200" y2="404" class="axis"/>
	<text x="184" y="159" class="label" text-anchor="end">elysia</text>
	<path d="M200 136 H376.104 A4 4 0 0 1 380.104 140 V164 A4 4 0 0 1 376.104 168 H200 Z" fill="#0369a1"/>
	<text x="392.104" y="159" class="value">0.0958 mJ</text>
	<text x="184" y="215" class="label" text-anchor="end">bun</text>
	<path d="M200 192 H383.812 A4 4 0 0 1 387.812 196 V220 A4 4 0 0 1 383.812 224 H200 Z" fill="#0369a1"/>
	<text x="399.812" y="215" class="value">0.0999 mJ</text>
	<text x="184" y="271" class="label" text-anchor="end">hono</text>
	<path d="M200 248 H385.88 A4 4 0 0 1 389.88 252 V276 A4 4 0 0 1 385.88 280 H200 Z" fill="#0369a1"/>
	<text x="401.88" y="271" class="value">0.1010 mJ</text>
	<text x="184" y="327" class="label" text-anchor="end">effect</text>
	<path d="M200 304 H429.12 A4 4 0 0 1 433.12 308 V332 A4 4 0 0 1 429.12 336 H200 Z" fill="#0369a1"/>
	<text x="445.12" y="327" class="value">0.1240 mJ</text>
	<text x="184" y="383" class="label" text-anchor="end">express</text>
	<path d="M200 360 H515.9759999999999 A4 4 0 0 1 519.9759999999999 364 V388 A4 4 0 0 1 515.9759999999999 392 H200 Z" fill="#0369a1"/>
	<text x="531.9759999999999" y="383" class="value">0.1702 mJ</text>
	<text x="24" y="480" class="note">Request-weighted over ping, query and body</text>
	<text x="24" y="508" class="note">25 measurements at 22 °C, powermetrics · lower is better</text>
</svg>
