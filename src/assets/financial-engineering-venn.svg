<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-label="Financial Engineering is where Mathematics, Finance and Programming overlap">
	<style>
		text { font-family: Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, 'Noto Sans Thai', 'Leelawadee UI', Thonburi, sans-serif; fill: #0f172a; }
		.title { font-size: 32px; font-weight: 600; letter-spacing: -0.01em; }
		.subtitle { font-size: 20px; fill: #475569; }
		.label { font-size: 22px; }
		.value { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
		.tick { font-size: 18px; fill: #64748b; font-variant-numeric: tabular-nums; }
		.note { font-size: 19px; fill: #475569; }
		.grid { stroke: #e2e8f0; stroke-width: 1; }
		.axis { stroke: #cbd5e1; stroke-width: 1.5; }
	</style>

	<circle cx="270" cy="190" r="160" fill="#0369a1" fill-opacity="0.08" stroke="#0369a1" stroke-width="2.5"/>
	<circle cx="450" cy="190" r="160" fill="#c2410c" fill-opacity="0.08" stroke="#c2410c" stroke-width="2.5"/>
	<circle cx="360" cy="340" r="160" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-width="2.5"/>
	
	<text x="200" y="160" text-anchor="middle" font-size="28" font-weight="600" paint-order="stroke" stroke="#ffffff" stroke-width="8" stroke-linejoin="round">Mathematics</text>
	<text x="200" y="190" text-anchor="middle" font-size="19" fill="#475569" paint-order="stroke" stroke="#ffffff" stroke-width="8" stroke-linejoin="round">Calculus · Statistics</text>
	
	<text x="520" y="160" text-anchor="middle" font-size="28" font-weight="600" paint-order="stroke" stroke="#ffffff" stroke-width="8" stroke-linejoin="round">Finance</text>
	<text x="520" y="190" text-anchor="middle" font-size="19" fill="#475569" paint-order="stroke" stroke="#ffffff" stroke-width="8" stroke-linejoin="round">Investment ·</text>
	<text x="520" y="214" text-anchor="middle" font-size="19" fill="#475569" paint-order="stroke" stroke="#ffffff" stroke-width="8" stroke-linejoin="round">Derivatives · Risk</text>
	
	<text x="360" y="430" text-anchor="middle" font-size="28" font-weight="600" paint-order="stroke" stroke="#ffffff" stroke-width="8" stroke-linejoin="round">Programming</text>
	<text x="360" y="460" text-anchor="middle" font-size="19" fill="#475569" paint-order="stroke" stroke="#ffffff" stroke-width="8" stroke-linejoin="round">Python · Data</text>
	<text x="360" y="248" text-anchor="middle" font-size="23" font-weight="600" paint-order="stroke" stroke="#ffffff" stroke-width="8" stroke-linejoin="round">Financial</text>
	<text x="360" y="278" text-anchor="middle" font-size="23" font-weight="600" paint-order="stroke" stroke="#ffffff" stroke-width="8" stroke-linejoin="round">Engineering</text>
	
</svg>
